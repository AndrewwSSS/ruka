name: Build and release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-latest
  cancel-in-progress: true

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset_name: Ruka-Windows.exe
            build_path: dist/Ruka.exe
          - os: macos-latest
            asset_name: Ruka-macOS
            build_path: dist/Ruka
          - os: ubuntu-latest
            asset_name: Ruka-Linux
            build_path: dist/Ruka
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # PySide6 dlopen's the system Qt/X11 libs during PyInstaller's
      # analysis pass, so headless Ubuntu runners need these present at
      # build time even though the app itself never runs here.
      - name: Install Qt runtime deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 libopengl0 libxkbcommon0 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xinerama0 libxcb-xfixes0 libdbus-1-3 libnss3 \
            libxcomposite1 libxdamage1 libxrandr2 libxtst6

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build
        run: pyinstaller ruka.spec --noconfirm

      - name: Stage artifact
        run: |
          mkdir -p out
          cp "${{ matrix.build_path }}" "out/${{ matrix.asset_name }}"
          chmod +x "out/${{ matrix.asset_name }}" || true

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: out/${{ matrix.asset_name }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      # Delete + recreate a single rolling "latest" release/tag so it
      # always reflects the newest commit on main, instead of piling up
      # one release per push.
      - name: Publish rolling "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest artifacts/*/* \
            --title "Latest build ($(git rev-parse --short HEAD))" \
            --notes "Automated build from commit ${{ github.sha }}." \
            --prerelease \
            --target "${{ github.sha }}"
