[platformio]
; Optional, not committed: overrides [deps] to build against a local MotorControl.
extra_configs = platformio.local*.ini

[deps]
lib_deps =
    https://github.com/AndrewwSSS/MotorControl.git#v0.3.0
    arduino-libraries/Servo@^1.3.0
    adafruit/Adafruit PWM Servo Driver Library@^3.0.3

[env:uno]
platform = atmelavr
board = uno
framework = arduino
lib_deps = ${deps.lib_deps}
lib_ldf_mode = deep+
monitor_speed = 9600
monitor_filters = send_on_enter
monitor_echo = yes
