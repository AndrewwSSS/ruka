# Builds the desktop app for Windows, macOS and Linux and publishes it as the
# rolling "latest" pre-release.
name: Build and release

on:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:

concurrency:
  group: release-latest
  cancel-in-progress: true

permissions:
  contents: write

defaults:
  run:
    shell: bash
    working-directory: desktop

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            exe_name: Ruka.exe
            asset_name: Ruka-Windows.exe
            build_path: dist/Ruka.exe
            archive: false
          - os: macos-latest
            exe_name: Ruka
            asset_name: Ruka-macOS.zip
            build_path: dist/Ruka
            archive: true
          - os: ubuntu-latest
            exe_name: Ruka
            asset_name: Ruka-Linux.zip
            build_path: dist/Ruka
            archive: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # PyInstaller's analysis loads Qt's system libraries, even on a headless runner.
      - name: Install Qt runtime deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 libopengl0 libxkbcommon0 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xinerama0 libxcb-xfixes0 libdbus-1-3 libnss3 \
            libxcomposite1 libxdamage1 libxrandr2 libxtst6

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build
        run: pyinstaller ruka.spec --noconfirm

      # A browser download drops the executable bit; zipping keeps it. The
      # Windows .exe does not need it, so it ships unzipped.
      - name: Stage artifact
        run: |
          mkdir -p out
          if [ "${{ matrix.archive }}" = "true" ]; then
            cp "${{ matrix.build_path }}" "${{ matrix.exe_name }}"
            chmod +x "${{ matrix.exe_name }}"
            zip "out/${{ matrix.asset_name }}" "${{ matrix.exe_name }}"
          else
            cp "${{ matrix.build_path }}" "out/${{ matrix.asset_name }}"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: desktop/out/${{ matrix.asset_name }}

  release:
    needs: build
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      # One rolling "latest" release, replaced on every build.
      - name: Publish rolling "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest artifacts/*/* \
            --title "Latest build ($(git rev-parse --short HEAD))" \
            --notes "Automated build from commit ${{ github.sha }}." \
            --prerelease \
            --target "${{ github.sha }}"
